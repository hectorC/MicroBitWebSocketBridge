appId: gl.cables.microbit.bridge
productName: MicroBit Cables Bridge
copyright: Hector Centeno

directories:
  output: dist
  buildResources: build

files:
  - src/**
  - package.json
beforePack: build/build-mac-ble.cjs

mac:
  category: public.app-category.education
  # One universal dmg rather than separate Intel/Apple Silicon downloads. Larger,
  # but removes "which Mac do you have?" from the setup instructions.
  target:
    - target: dmg
      arch: [universal]
  extraResources:
    - from: build/generated
      filter: [microbit-ble]
  # Without this key macOS denies Bluetooth silently: no prompt, no error, just
  # an empty device list.
  extendInfo:
    NSBluetoothAlwaysUsageDescription: >-
      This app connects to your micro:bit over Bluetooth to send its sensor data
      to cables.gl.
    NSBluetoothPeripheralUsageDescription: >-
      This app connects to your micro:bit over Bluetooth to send its sensor data
      to cables.gl.
  # Unsigned classroom build. Students approve it once in
  # System Settings -> Privacy & Security -> Open Anyway.
  identity: null
  hardenedRuntime: false

win:
  target:
    # Installer for students who want a Start Menu entry, plus a single-file
    # portable build for anyone who would rather not install anything.
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false # per-user install, so no admin rights needed
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
